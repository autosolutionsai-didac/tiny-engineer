; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = xiao-esp32s3

; Default target: Seeed Studio XIAO ESP32S3 (ESP32-S3R8, 8 MB flash, 8 MB octal PSRAM).
[env:xiao-esp32s3]
; Arduino-ESP32 3.x (ESP_I2S + RMT HAL); official PIO platform stays on 2.x
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32s3
framework = arduino

monitor_speed = 115200

lib_deps =
    adafruit/Adafruit PWM Servo Driver Library
    adafruit/Adafruit GFX Library
    adafruit/Adafruit SSD1306
    links2004/WebSockets@^2.6.1
    bblanchon/ArduinoJson@^7.3.0

; Board JSON already sets BOARD_HAS_PSRAM, native USB CDC and qio_opi memory.
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D SSD1306_NO_SPLASH
    -D BOARD_HAS_PSRAM

board_build.arduino.memory_type = qio_opi
board_build.flash_size = 8MB
board_build.partitions = partitions_8mb.csv
board_build.filesystem = littlefs

extra_scripts =
    pre:scripts/copy_assets.py
    post:scripts/upload_fs_after_upload.py

test_ignore = *

; Legacy target: Waveshare ESP32-C3-Zero (PlatformIO board name esp32-c3-devkitm-1).
[env:esp32-c3-devkitm-1]
platform = ${env:xiao-esp32s3.platform}
board = esp32-c3-devkitm-1
framework = arduino

monitor_speed = 115200

lib_deps = ${env:xiao-esp32s3.lib_deps}

build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D SSD1306_NO_SPLASH

board_build.partitions = partitions.csv
board_build.filesystem = littlefs

extra_scripts =
    pre:scripts/copy_assets.py
    post:scripts/upload_fs_after_upload.py

test_ignore = *

; Host Unity tests — never flash. Run: pio test -e native
[env:native]
platform = native
test_framework = unity
test_build_src = true
build_src_filter =
    -<**/*.*>
    +<settings/validate.cpp>
    +<display/eyes/styles/eye_style_ids.cpp>
    +<sessions/session_table.cpp>
    +<sessions/arbiter.cpp>
    +<sessions/led_bar.cpp>
build_flags = -std=c++17 -Iinclude -Isrc

; Opt-in OLED-only application. Building does not upload or change robot settings.
[env:expression-demo]
platform = ${env:xiao-esp32s3.platform}
board = ${env:xiao-esp32s3.board}
framework = ${env:xiao-esp32s3.framework}
monitor_speed = ${env:xiao-esp32s3.monitor_speed}
build_flags = ${env:xiao-esp32s3.build_flags}
board_build.arduino.memory_type = ${env:xiao-esp32s3.board_build.arduino.memory_type}
board_build.flash_size = ${env:xiao-esp32s3.board_build.flash_size}
board_build.partitions = ${env:xiao-esp32s3.board_build.partitions}
; For an upside-down OLED, append: -D EXPRESSION_DEMO_ROTATION=2
lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit SSD1306
build_src_filter =
    -<*>
    +<../examples/expression-demo/main.cpp>
test_ignore = *
